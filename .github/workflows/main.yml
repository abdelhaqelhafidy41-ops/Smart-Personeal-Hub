name: Flet Windows Build

on:
  workflow_dispatch:

env:
  BUILD_NUMBER: 1
  BUILD_VERSION: 1.0.0

  # Python
  PYTHON_VERSION: "3.13"

  # Flet CLI
  FLET_CLI_VERSION: "0.86.5"

  PYTHONUTF8: "1"
  FLET_CLI_NO_RICH_OUTPUT: "1"
  UV_NO_PROGRESS: "1"

  PROJECT_NAME: SendLocation

jobs:

  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout source code
        uses: actions/checkout@v4


      # ============================================================
      # 2. Setup Python
      # ============================================================
      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip


      # ============================================================
      # 3. Upgrade pip
      # ============================================================
      - name: Upgrade pip
        shell: pwsh
        run: |
          python -m pip install --upgrade pip


      # ============================================================
      # 4. Install Flet CLI
      # ============================================================
      - name: Install Flet CLI ${{ env.FLET_CLI_VERSION }}
        shell: pwsh
        run: |
          python -m pip install "flet-cli==${env:FLET_CLI_VERSION}"

          Write-Host ""
          Write-Host "Installed Flet:"
          flet --version


      # ============================================================
      # 5. Check Flet environment
      # ============================================================
      - name: Check Flet environment
        shell: pwsh
        run: |
          Write-Host "Python:"
          python --version

          Write-Host ""
          Write-Host "Flet:"
          flet --version

          Write-Host ""
          Write-Host "Flutter:"
          flutter --version

        continue-on-error: true


      # ============================================================
      # 6. Build Windows application
      # ============================================================
      - name: Install Library background
        run: |
           pip install -r requirements.txt
           
      - name: Build Windows application
        shell: pwsh
        run: |
          flet build windows `
            --verbose `
            --no-rich-output `
            --yes `
            --build-number=$env:BUILD_NUMBER `
            --build-version=$env:BUILD_VERSION


      # ============================================================
      # 7. Display generated files
      # ============================================================
      - name: Show Windows build output
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Windows build output"
          Write-Host "=========================================="

          if (Test-Path "build/windows") {
              Get-ChildItem -Path "build/windows" -Recurse |
                Select-Object FullName, Length
          }
          else {
              Write-Error "build/windows was not created."
              exit 1
          }


      # ============================================================
      # 8. Create ZIP
      # ============================================================
      - name: Compress Windows application
        shell: pwsh
        run: |
          if (Test-Path "windows") {
              Remove-Item "windows" -Recurse -Force
          }

          Compress-Archive `
            -Path "build/windows/*" `
            -DestinationPath "windows.zip" `
            -CompressionLevel Optimal

          Write-Host ""
          Write-Host "Created: windows.zip"


      # ============================================================
      # 9. Upload Windows artifact
      # ============================================================
      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}_Windows_x64_v${{ env.BUILD_VERSION }}
          path: windows.zip
          if-no-files-found: error
          compression-level: 9
          overwrite: true
