name: Build Android APK

on:
  workflow_dispatch:

env:
  BUILD_NUMBER: 1
  BUILD_VERSION: 1.0.0
  PYTHON_VERSION: "3.13"
  FLET_CLI_VERSION: "0.86.5"
  PYTHONUTF8: "1"
  FLET_CLI_NO_RICH_OUTPUT: "1"
  UV_NO_PROGRESS: "1"
  PROJECT_NAME: SendLocation

jobs:
  build-apk:

    runs-on: ubuntu-latest

    steps:

      # ==============================
      # Checkout
      # ==============================
      - name: Checkout source code
        uses: actions/checkout@v4


      # ==============================
      # Python
      # ==============================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}


      # ==============================
      # Install Flet
      # ==============================
      - name: Install Flet CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install "flet-cli==${FLET_CLI_VERSION}"

          echo "Flet version:"
          flet --version


      # ==============================
      # Build APK
      # ==============================
      - name: Install Library background
        run: |
           pip install -r requirements.txt
        
      - name: Build Android APK
        run: |
          flet build apk \
            --verbose \
            --no-rich-output \
            --yes \
            --build-number="$BUILD_NUMBER" \
            --build-version="$BUILD_VERSION"


      # ==============================
      # Check output
      # ==============================
      - name: Show APK files
        run: |
          echo "=============================="
          echo "APK BUILD OUTPUT"
          echo "=============================="

          find build/apk -type f -print


      # ==============================
      # Upload all APK files
      # ==============================
      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:
          name: ${{ env.PROJECT_NAME }}_Android_APK_v${{ env.BUILD_VERSION }}

          path: |
            build/apk/*.apk
            build/apk/*.sha1

          if-no-files-found: error

          compression-level: 9
