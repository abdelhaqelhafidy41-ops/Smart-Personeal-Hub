name: Smart Personal Hub - Desktop and Mobile Builds

on:
  workflow_dispatch:

  # يمكنك تفعيل البناء التلقائي عند push إذا أردت:
  # push:
  #   branches:
  #     - main

env:
  # ============================================================
  # APP VERSION
  # ============================================================
  BUILD_NUMBER: 1
  BUILD_VERSION: 1.0.0

  # ============================================================
  # PYTHON / FLET
  # ============================================================
  PYTHON_VERSION: "3.13"
  FLET_CLI_VERSION: "0.86.5"

  # ============================================================
  # PYTHON / FLET SETTINGS
  # ============================================================
  PYTHONUTF8: "1"
  FLET_CLI_NO_RICH_OUTPUT: "1"
  UV_NO_PROGRESS: "1"

  # ============================================================
  # PROJECT
  # ============================================================
  PROJECT_NAME: "SmartPersonalHub"


jobs:

  # ============================================================
  # 1. LINUX
  # ============================================================
  build-linux:

    name: Build Linux

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Python
      # --------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # --------------------------------------------------------
      # System dependencies
      # --------------------------------------------------------
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libgtk-3-dev \
            pkg-config

      # --------------------------------------------------------
      # Python dependencies
      # --------------------------------------------------------
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            "cryptography>=43.0.0" \
            "Pillow>=10.0.0" \
            "matplotlib>=3.8.0" \
            "openpyxl>=3.1.0" \
            "reportlab>=4.0.0"

      # --------------------------------------------------------
      # Flet CLI
      # --------------------------------------------------------
      - name: Install Flet CLI
        run: |
          python -m pip install "flet-cli==${FLET_CLI_VERSION}"

          echo "Flet version:"
          flet --version

      # --------------------------------------------------------
      # Build
      # --------------------------------------------------------
      - name: Build Linux
        run: |
          flet build linux \
            --verbose \
            --no-rich-output \
            --yes \
            --build-number="$BUILD_NUMBER" \
            --build-version="$BUILD_VERSION"

      # --------------------------------------------------------
      # Show files
      # --------------------------------------------------------
      - name: Show Linux build files
        run: |
          echo "================================"
          echo "LINUX BUILD OUTPUT"
          echo "================================"

          find build/linux -type f -print

      # --------------------------------------------------------
      # Upload
      # --------------------------------------------------------
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}_Linux_x64_v${{ env.BUILD_VERSION }}
          path: build/linux
          if-no-files-found: error
          compression-level: 9


  # ============================================================
  # 2. macOS
  # ============================================================
  build-macos:

    name: Build macOS

    runs-on: macos-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # --------------------------------------------------------
      # Python dependencies
      # --------------------------------------------------------
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            "cryptography>=43.0.0" \
            "Pillow>=10.0.0" \
            "matplotlib>=3.8.0" \
            "openpyxl>=3.1.0" \
            "reportlab>=4.0.0"

      # --------------------------------------------------------
      # Flet
      # --------------------------------------------------------
      - name: Install Flet CLI
        run: |
          python -m pip install "flet-cli==${FLET_CLI_VERSION}"

          echo "Flet version:"
          flet --version

      # --------------------------------------------------------
      # Build
      # --------------------------------------------------------
      - name: Build macOS
        run: |
          flet build macos \
            --verbose \
            --no-rich-output \
            --yes \
            --build-number="$BUILD_NUMBER" \
            --build-version="$BUILD_VERSION"

      # --------------------------------------------------------
      # Show files
      # --------------------------------------------------------
      - name: Show macOS build files
        run: |
          find build/macos -type f -print

      # --------------------------------------------------------
      # Compress
      # --------------------------------------------------------
      - name: Compress macOS artifact
        run: |
          zip -9 -r macOS.zip build/macos

      # --------------------------------------------------------
      # Upload
      # --------------------------------------------------------
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}_macOS_v${{ env.BUILD_VERSION }}
          path: macOS.zip
          if-no-files-found: error
          compression-level: 9


  # ============================================================
  # 3. WINDOWS
  # ============================================================
  build-windows:

    name: Build Windows

    runs-on: windows-latest

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Python
      # --------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # --------------------------------------------------------
      # Python dependencies
      # --------------------------------------------------------
      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip

          python -m pip install `
            "cryptography>=43.0.0" `
            "Pillow>=10.0.0" `
            "matplotlib>=3.8.0" `
            "openpyxl>=3.1.0" `
            "reportlab>=4.0.0"

      # --------------------------------------------------------
      # Flet CLI
      # --------------------------------------------------------
      - name: Install Flet CLI
        shell: pwsh
        run: |
          python -m pip install "flet-cli==${env:FLET_CLI_VERSION}"

          Write-Host "Flet version:"
          flet --version

      # --------------------------------------------------------
      # Build Windows
      #
      # --yes is VERY IMPORTANT
      # لأنه يمنع Flet من التوقف عند:
      #
      # Flutter SDK ... is required.
      # Proceed? [y/n]
      #
      # --------------------------------------------------------
      - name: Build Windows
        shell: pwsh
        run: |
          flet build windows `
            --verbose `
            --no-rich-output `
            --yes `
            --build-number="${env:BUILD_NUMBER}" `
            --build-version="${env:BUILD_VERSION}"

      # --------------------------------------------------------
      # Show files
      # --------------------------------------------------------
      - name: Show Windows build files
        shell: pwsh
        run: |
          Write-Host "================================"
          Write-Host "WINDOWS BUILD OUTPUT"
          Write-Host "================================"

          if (Test-Path "build/windows") {
            Get-ChildItem "build/windows" -Recurse
          }
          else {
            Write-Error "build/windows was not found."
            exit 1
          }

      # --------------------------------------------------------
      # Upload
      # --------------------------------------------------------
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}_Windows_x64_v${{ env.BUILD_VERSION }}
          path: build/windows
          if-no-files-found: error
          compression-level: 9


  # ============================================================
  # 4. ANDROID AAB
  # ============================================================
  build-aab:

    name: Build Android AAB

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Python
      # --------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # --------------------------------------------------------
      # Install dependencies
      # --------------------------------------------------------
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            "cryptography>=43.0.0" \
            "Pillow>=10.0.0" \
            "matplotlib>=3.8.0" \
            "openpyxl>=3.1.0" \
            "reportlab>=4.0.0"

      # --------------------------------------------------------
      # Flet CLI
      # --------------------------------------------------------
      - name: Install Flet CLI
        run: |
          python -m pip install "flet-cli==${FLET_CLI_VERSION}"

          echo "Flet version:"
          flet --version

      # --------------------------------------------------------
      # Build AAB
      #
      # --yes prevents interactive dependency prompts.
      # --------------------------------------------------------
      - name: Build Android AAB
        run: |
          flet build aab \
            --verbose \
            --no-rich-output \
            --yes \
            --build-number="$BUILD_NUMBER" \
            --build-version="$BUILD_VERSION"

      # --------------------------------------------------------
      # Show output
      # --------------------------------------------------------
      - name: Show AAB files
        run: |
          echo "================================"
          echo "ANDROID AAB OUTPUT"
          echo "================================"

          find build/aab -type f -print

      # --------------------------------------------------------
      # Upload AAB
      # --------------------------------------------------------
      - name: Upload Android AAB
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}_AAB_v${{ env.BUILD_VERSION }}
          path: build/aab/*.aab
          if-no-files-found: error
          compression-level: 9


  # ============================================================
  # 5. ANDROID APK
  # ============================================================
  build-apk:

    name: Build Android APK

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Python
      # --------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # --------------------------------------------------------
      # Dependencies
      # --------------------------------------------------------
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            "cryptography>=43.0.0" \
            "Pillow>=10.0.0" \
            "matplotlib>=3.8.0" \
            "openpyxl>=3.1.0" \
            "reportlab>=4.0.0"

      # --------------------------------------------------------
      # Flet CLI
      # --------------------------------------------------------
      - name: Install Flet CLI
        run: |
          python -m pip install "flet-cli==${FLET_CLI_VERSION}"

          echo "Flet version:"
          flet --version

      # --------------------------------------------------------
      # Build APK
      # --------------------------------------------------------
      - name: Build Android APK
        run: |
          flet build apk \
            --verbose \
            --no-rich-output \
            --yes \
            --build-number="$BUILD_NUMBER" \
            --build-version="$BUILD_VERSION"

      # --------------------------------------------------------
      # Show APK files
      # --------------------------------------------------------
      - name: Show APK files
        run: |
          echo "================================"
          echo "ANDROID APK OUTPUT"
          echo "================================"

          find build/apk -type f -print

      # --------------------------------------------------------
      # Upload ALL APK files
      #
      # بدلاً من تحديد:
      # app-arm64-v8a-release.apk
      # app-armeabi-v7a-release.apk
      # app-x86_64-release.apk
      #
      # نرفع كل APK يتم إنشاؤه.
      # --------------------------------------------------------
      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}_Android_APKs_v${{ env.BUILD_VERSION }}
          path: |
            build/apk/*.apk
            build/apk/*.sha1
          if-no-files-found: error
          compression-level: 9


  # ============================================================
  # 6. iOS IPA
  # ============================================================
  build-ipa:

    name: Build iOS IPA

    runs-on: macos-latest

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Python
      # --------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # --------------------------------------------------------
      # Dependencies
      # --------------------------------------------------------
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            "cryptography>=43.0.0" \
            "Pillow>=10.0.0" \
            "matplotlib>=3.8.0" \
            "openpyxl>=3.1.0" \
            "reportlab>=4.0.0"

      # --------------------------------------------------------
      # Flet CLI
      # --------------------------------------------------------
      - name: Install Flet CLI
        run: |
          python -m pip install "flet-cli==${FLET_CLI_VERSION}"

          echo "Flet version:"
          flet --version

      # --------------------------------------------------------
      # Build IPA
      # --------------------------------------------------------
      - name: Build iOS IPA
        run: |
          flet build ipa \
            --verbose \
            --no-rich-output \
            --yes \
            --build-number="$BUILD_NUMBER" \
            --build-version="$BUILD_VERSION"

      # --------------------------------------------------------
      # Show files
      # --------------------------------------------------------
      - name: Show IPA files
        run: |
          echo "================================"
          echo "IOS IPA OUTPUT"
          echo "================================"

          find build/ipa -type f -print

      # --------------------------------------------------------
      # Upload
      # --------------------------------------------------------
      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}_IPA_v${{ env.BUILD_VERSION }}
          path: build/ipa
          if-no-files-found: error
          compression-level: 9
